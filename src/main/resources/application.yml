# Configuration names are documented in .env.example and docs/18-production-plan.md section 5.
# No secret value belongs in this file.
spring:
  application:
    name: campus-companion
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    # The running application connects as the runtime role (cc_app).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    # Migrations run as the migration role (cc_migrator), which owns schema app.
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    default-schema: app
    schemas: app
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  # Pages, scripts, styles and the 3D decoder are sent compressed (the landing script falls from
  # 1.3 MB to about 370 KB). JSON is left out on purpose: an API answer can hold a secret, such as
  # the CSRF token, next to text the user typed, and compressing both together leaks the secret's
  # length (BREACH).
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: text/html,text/css,text/javascript,application/javascript,image/svg+xml,application/wasm
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

app:
  notes:
    # Documents that may be attached besides PDF. The storage bucket accepts only PDF and JPEG, so
    # this is empty until its allowed types are widened. See docs/22 and ADR 0014.
    extra-file-types: ${NOTES_EXTRA_FILE_TYPES:}
  security:
    login:
      # Fixed defaults, defined in docs/18-production-plan.md section 5.
      max-failed-attempts: 5
      lock-duration: 15m
      max-attempts-per-ip: 20
      ip-window: 10m
    # Off on a developer's machine, which has no HTTPS. The prod profile switches it on.
    require-https: false
    api:
      # Fixed defaults, defined in docs/09-api-contract.md section 6. Despite its name, the limit
      # is counted per account once logged in, across all of its sessions (CC-18).
      max-requests-per-session: 120
      window: 1m
      max-json-body: 64KB
  identity:
    student-email-domain: ${STUDENT_EMAIL_DOMAIN}
  academic:
    attendance-required-percent: ${ATTENDANCE_REQUIRED_PERCENT:75}
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:learning-resources}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:30}
    daily-limit-global: ${AI_DAILY_LIMIT_GLOBAL:500}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    # Fixed defaults, defined in docs/12-AI-features-spec.md section 2. Changed only by a reviewed
    # code change, not by an environment variable.
    per-minute-limit: 5
    max-concurrent-per-user: 2
    connect-timeout: 5s
    response-timeout: 20s
    total-budget: 25s
    # Used when AI_PROVIDER=router: the models to try, in order, and how hard to try (docs/12 2b).
    # Each provider's keys come from <PROVIDER>_API_KEY, <PROVIDER>_API_KEY_2, ... in the environment.
    # T7-09: removes AI usage-log rows (numbers only) older than the retention period, nightly.
    # Off unless AI_LOG_RETENTION_ENABLED is true: the owner decides when rows may be deleted.
    log-retention:
      enabled: ${AI_LOG_RETENTION_ENABLED:false}
      days: ${AI_LOG_RETENTION_DAYS:90}
      batch-size: 1000
      max-batches: 50
    routing:
      routes: ${AI_ROUTES:}
      max-attempts: 3
      attempt-timeout: 15s
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  seed:
    demo-enabled: ${DEMO_SEED_ENABLED:false}
  question-bank:
    # The course question banks bundled in question-bank/*.json: added once to the subjects with
    # matching codes at start-up, published, for Quick Exam.
    enabled: ${QUESTION_BANK_ENABLED:true}
