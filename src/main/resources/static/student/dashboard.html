<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Campus Companion</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <span class="app-header__brand">Campus Companion</span>
        <span class="app-header__spacer"></span>
        <a class="app-header__user app-header__user--link" id="user-name" href="/student/profile.html" title="Your profile"></a>
        <button type="button" id="logout" class="button button--text">Log out</button>
      </header>
      <nav class="app-nav" aria-label="Main">
        <div class="app-nav__group">
          <a class="app-nav__item" href="/student/dashboard.html" aria-current="page">Home</a>
          <span class="app-nav__item" aria-disabled="true">Academics</span>
          <span class="app-nav__item" aria-disabled="true">Resources</span>
          <span class="app-nav__item" aria-disabled="true">Quiz</span>
          <span class="app-nav__item" aria-disabled="true">Assistant</span>
        </div>
      </nav>
      <main class="app-main">
        <div class="page-head">
          <h1 id="greeting">Welcome</h1>
          <p class="muted">Your dashboard</p>
        </div>
        <div class="card empty-state">
          <h2>Nothing to show yet</h2>
          <p>Attendance, results, today's classes and notices will appear here as each part is built.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/js/student-dashboard.js"></script>
  </body>
</html>
