<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change password · Campus Companion</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
      <section class="auth-art" aria-hidden="true">
        <div class="auth-art__inner">
          <svg class="mascot" viewBox="0 0 220 176" aria-hidden="true" focusable="false">
            <!-- The sign-in robot, drawn by hand for this project after the owner's reference video. -->
            <g class="mascot__antenna" fill="none" stroke="#f5f5f7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 9 L25 25 L37 30 L41 41" stroke-width="6" />
              <path d="M31 46 L50 38" stroke-width="9" stroke-linecap="butt" />
              <circle cx="20" cy="8" r="6" fill="#f5f5f7" stroke="none" />
            </g>
            <rect x="3" y="88" width="13" height="38" rx="4" fill="#f5f5f7" />
            <rect x="204" y="88" width="13" height="38" rx="4" fill="#f5f5f7" />
            <polygon points="64,54 156,54 192,86 192,128 156,162 64,162 28,128 28,86" fill="none" stroke="#f5f5f7" stroke-width="13" stroke-linejoin="round" />
            <g class="mascot__face">
              <g class="mascot__eye">
                <g class="mascot__blink">
                  <path d="M84 84 Q86 78 93 78 L116 76 Q124 76 126 84 L132 126 Q133 134 125 135 L96 137 Q89 137 86 131 L78 112 Q76 106 79 100 Z" fill="#f5f5f7" />
                  <path d="M97 99 L113 115 M113 99 L97 115" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
                  <path d="M151 100 L163 98 L164 114 L152 116 Z" fill="#f5f5f7" />
                </g>
              </g>
              <g class="mascot__lid" fill="none" stroke="#f5f5f7" stroke-width="7" stroke-linecap="round">
                <path d="M88 108 H122" />
                <path d="M150 108 H164" />
              </g>
            </g>
          </svg>
          <div class="mascot__shadow"></div>
          <p class="auth-art__name">Campus Companion</p>
          <p class="auth-art__tagline">Choose a password only you know.</p>
        </div>
      </section>
        <form id="change-form" class="auth-form" novalidate>
          <div class="auth-form__head">
            <span class="auth-form__avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" />
            </svg>
            </span>
            <h1>Change your password</h1>
            <p class="muted small" id="intro">Enter your current password, then the new one twice.</p>
          </div>
          <div id="banner" class="banner banner--error" hidden>
            <span class="banner__label">Error</span>
            <span class="banner__text"></span>
          </div>
          <div class="auth-form__fields">
          <div class="field">
            <label class="field__label" for="currentPassword">Current password</label>
            <div class="field__control">
              <input class="input input--with-toggle" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="72" aria-describedby="currentPassword-error" required />
              <button type="button" id="toggle-password" class="field__toggle" aria-label="Show password" aria-pressed="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              </button>
            </div>
            <p class="field__error" id="currentPassword-error" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="newPassword">New password</label>
            <div class="field__control">
              <input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" maxlength="72" aria-describedby="newPassword-error newPassword-help" required />
            </div>
            <p class="field__help" id="newPassword-help">8 to 72 characters. Not your roll number or your email address.</p>
            <p class="field__error" id="newPassword-error" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="confirmNewPassword">New password again</label>
            <div class="field__control">
              <input class="input" id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password" maxlength="72" aria-describedby="confirmNewPassword-error" required />
            </div>
            <p class="field__error" id="confirmNewPassword-error" hidden></p>
          </div>
          </div>
          <button type="submit" id="submit" class="button button--inverse button--block">
            <span class="spinner" hidden></span>
            <span>Change password</span>
          </button>
          <p class="auth-form__foot">
            <button type="button" id="logout" class="button button--text">Log out</button>
          </p>
        </form>
      </div>
    </main>
    <script type="module" src="/js/change-password.js"></script>
  </body>
</html>
