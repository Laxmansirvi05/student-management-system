          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Admin]
      summary: Remove a notice's official document
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200":
          description: The notice, now text only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      tags: [Admin]
      summary: Signed link to a notice's official document, drafts included
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: download, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeDocumentLink" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/notices/{id}/publish:
    post:
      tags: [Admin]
      summary: Publish a notice
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "204": { description: Published. }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/resources:
    get:
      tags: [Admin]
      summary: List all resources including hidden ones
      parameters:
        - { name: subjectId, in: query, schema: { type: integer, format: int64 } }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ResourceStatus" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of resources.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/AdminResource" }
    post:
      tags: [Admin]
      summary: Upload a resource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, at most 10 MB.
                metadata: { $ref: "#/components/schemas/ResourceMetadata" }
            encoding:
              metadata:
                contentType: application/json
      responses:
        "201":
          description: Stored and published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /pyqs/overview:
    get:
      tags: [Student]
      summary: Branches, years and regulations of the past-paper library (FR-LIB-006)
      responses:
        "200":
          description: Counts and filter values.
          content:
            application/json:
              schema:
                type: object
                required: [branches, years, regulations, totalPapers]
                properties:
                  branches:
                    type: array
                    items:
                      type: object
                      required: [branch, subjects, papers]
                      properties:
                        branch: { type: string }
                        subjects: { type: integer }
                        papers: { type: integer }
                  years: { type: array, items: { type: integer } }
                  regulations: { type: array, items: { type: string } }
                  totalPapers: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }

  /pyqs/subjects:
    get:
      tags: [Student]
      summary: One entry per subject of the past-paper library
      parameters:
        - { name: branch, in: query, schema: { type: string, maxLength: 10 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Subjects by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [branch, subject, papers, firstYear, latestYear]
                  properties:
                    branch: { type: string }
                    subject: { type: string }
                    papers: { type: integer, format: int64 }
                    firstYear: { type: integer }
                    latestYear: { type: integer }

  /pyqs:
    get:
      tags: [Student]
      summary: Search past papers
      parameters:
        - { name: branch, in: query, schema: { type: string, maxLength: 10 } }
        - { name: subject, in: query, schema: { type: string, maxLength: 120 } }
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/PyqKind" } }
        - { name: regulation, in: query, schema: { type: string, maxLength: 10 } }
        - { name: q, in: query, description: "Subject, course code or year. Case-insensitive; % and _ are ordinary characters.", schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, popular, subject], default: newest } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of published papers.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/PyqPaper" }
        "400": { $ref: "#/components/responses/Problem" }

  /pyqs/saved:
    get:
      tags: [Student]
      summary: The student's saved papers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of saved, published papers.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/PyqPaper" }

  /pyqs/{id}/link:
    get:
      tags: [Student]
      summary: A five-minute link to open or download a paper
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: download, in: query, description: "true saves the file under a readable name and counts the download.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PyqLink" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /pyqs/{id}/save:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [Student]
      summary: Save a paper (idempotent)
      responses:
        "204": { description: Saved. }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Student]
      summary: Unsave a paper (idempotent)
      responses:
        "204": { description: Not saved any more. }

  /admin/pyqs:
    get:
      tags: [Admin]
      summary: List all past papers, hidden ones included
      parameters:
        - { name: branch, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PUBLISHED, HIDDEN] } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of papers.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/PyqPaper" }
    post:
      tags: [Admin]
      summary: Add a past paper (a PDF, with its details or its folder path)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "PDF, at most 10 MB." }
                metadata: { $ref: "#/components/schemas/PyqMetadata" }
                path: { type: string, description: "Where the file sits in the organised folder, for example CSE/Machine Learning/2025(December)-supply AR20.pdf. Used when metadata is not sent." }
            encoding:
              metadata: { contentType: application/json }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PyqPaper" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/pyqs/{id}/link:
    get:
      tags: [Admin]
      summary: A five-minute link to any paper (not counted as a download)
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PyqLink" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/pyqs/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [Admin]
      summary: Change a paper's details or visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metadata, status]
              properties:
                metadata: { $ref: "#/components/schemas/PyqMetadata" }
                status: { type: string, enum: [PUBLISHED, HIDDEN] }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PyqPaper" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Admin]
      summary: Remove a paper, its saves and its file
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Read the audit log, newest first (P1, FR-ADM-009)
      description: >
        Read only. The actor and the subject are shown as an email address or a roll number where
        one is known. For password events the old and new values are always null.
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of audit entries.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          type: object
                          required: [id, createdAt, action, actor, entityType, entityId]
                          properties:
                            id: { type: integer, format: int64 }
                            createdAt: { type: string, format: date-time }
                            action: { type: string }
                            actor: { type: string, description: "Email, or System." }
                            entityType: { type: string }
                            entityId: { type: string }
                            subject: { type: string, nullable: true }
                            oldValue: { type: object, nullable: true }
                            newValue: { type: object, nullable: true }
                            ipAddress: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/audit-logs/actions:
    get:
      tags: [Admin]
      summary: The audit actions that can appear, for the filter
      responses:
        "200":
          description: Action names.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/quiz-questions:
    get:
      tags: [Admin]
      summary: List questions
      parameters:
        - { name: subjectId, in: query, schema: { type: integer, format: int64 } }
        - { name: unitId, in: query, schema: { type: integer, format: int64 } }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/QuestionStatus" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of questions including correct options.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/AdminQuizQuestion" }
    post:
      tags: [Admin]
      summary: Create a question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizQuestionWriteRequest" }
      responses:
        "201":
          description: Created with the status in the request, which is DRAFT or PUBLISHED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuizQuestion" }
        "400": { $ref: "#/components/responses/Problem" }

  /admin/quiz-questions/{id}:
    put:
      tags: [Admin]
      summary: Update a question, including its status
      description: >
        Once a question has been served in an attempt, its subject, unit, text, options and correct
        option can no longer change (409), and its status is PUBLISHED or RETIRED. The explanation
        and the difficulty can still be edited.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizQuestionWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQuizQuestion" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/subjects:
    get:
      tags: [Admin]
      summary: List all subjects including inactive ones
      parameters:
        - { name: branch, in: query, schema: { type: string } }
        - { name: semester, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
      responses:
        "200":
          description: Subjects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSubject" }
    post:
      tags: [Admin]
      summary: Create a subject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectWriteRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSubject" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/subjects/{id}:
    put:
      tags: [Admin]
      summary: Update or deactivate a subject
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSubject" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/subjects/{id}/units:
    post:
      tags: [Admin]
      summary: Add a unit to a subject
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitWriteRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/units/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [Admin]
      summary: Update a unit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Admin]
      summary: Remove a unit that is not in use
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/timetable:
    get:
      tags: [Admin]
      summary: List timetable entries
      parameters:
        - { name: branch, in: query, schema: { type: string } }
        - { name: semester, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: section, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entries in day and time order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTimetableEntry" }
    post:
      tags: [Admin]
      summary: Create a timetable entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetableWriteRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTimetableEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/timetable/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [Admin]
      summary: Update a timetable entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetableWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTimetableEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Admin]
      summary: Delete a timetable entry
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/notices/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [Admin]
      summary: Update a notice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoticeWriteRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Admin]
      summary: Delete a notice
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/notices/{id}/unpublish:
    post:
      tags: [Admin]
      summary: Return a notice to draft
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "204": { description: Unpublished. }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/resources/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [Admin]
      summary: Update a resource's details or status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResource" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Admin]
      summary: Delete a resource and its stored file
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Required on POST, PUT, PATCH and DELETE.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SubjectIdPath:
      name: subjectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Problem:
      description: Error in RFC 9457 problem-detail format. See the code field.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ResourceReportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    StudyTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 1000, nullable: true }
        subjectId: { type: integer, nullable: true }
        dueDate: { type: string, format: date, nullable: true, description: "From today to five years ahead; an unchanged date is kept on edit." }
    ExamRequest:
      type: object
      additionalProperties: false
      required: [name, examDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        subjectId: { type: integer, nullable: true }
        examDate: { type: string, format: date, description: "From today to five years ahead; an unchanged date is kept on edit." }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        traceId: { type: string }
        available:
          type: integer
          description: Present with QUIZ_NOT_ENOUGH_QUESTIONS.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - AUTH_REQUIRED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_PASSWORD_CHANGE_REQUIRED
        - AUTH_ACCOUNT_LOCKED
        - ACCESS_DENIED
        - CSRF_INVALID
        - NOT_FOUND
        - CONFLICT
        - QUIZ_NOT_ENOUGH_QUESTIONS
        - QUIZ_ALREADY_SUBMITTED
        - QUIZ_ATTEMPT_EXPIRED
        - UPLOAD_TOO_LARGE
        - UPLOAD_INVALID_TYPE
        - RATE_LIMITED
        - AI_REQUEST_DECLINED
        - AI_QUOTA_EXCEEDED
        - AI_INVALID_RESPONSE
        - AI_UNAVAILABLE
        - AI_TIMEOUT
        - STORAGE_UNAVAILABLE
        - INTERNAL_ERROR

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Role:
      type: string
      enum: [STUDENT, ADMIN]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The account's institutional email address. Trimmed and lower-cased by the server.
          example: 23cse001@university.example
        password: { type: string, minLength: 1, maxLength: 72, format: password }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 72, format: password }
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: >
            Ignoring letter case, must not equal the user's roll number, email
            address, the part of the email before the @, or current password.
        confirmNewPassword:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: Must equal newPassword.

    CurrentUser:
      type: object
      required: [email, displayName, role, mustChangePassword]
      properties:
        email: { type: string, format: email, description: The account's login email. }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        mustChangePassword: { type: boolean }

    StudentProfile:
      type: object
      required: [rollNo, email, fullName, branch, currentSemester, section, admissionYear]
      properties:
        rollNo: { type: string, description: The academic identifier. Not the login identifier. }
        email:
          type: string
          format: email
          description: The institutional login email, generated at provisioning. An identifier only; not verified.
        fullName: { type: string }
        branch: { type: string }
        currentSemester: { type: integer, minimum: 1, maximum: 8 }
        section: { type: string }
        admissionYear: { type: integer }
        phone: { type: string, nullable: true }
        bio: { type: string, maxLength: 280, nullable: true, description: A few lines the student wrote about themselves. }
        personalEmail: { type: string, format: email, nullable: true }
        linkedinUrl: { type: string, format: uri, nullable: true, description: "https, on linkedin.com" }
        githubUrl: { type: string, format: uri, nullable: true, description: "https, on github.com" }
        portfolioUrl: { type: string, format: uri, nullable: true, description: "https" }
        skills: { type: string, maxLength: 200, nullable: true, description: "Separated by commas." }
        hasPhoto: { type: boolean, description: Whether the student has a profile photo. The photo is fetched through /students/me/photo-url. }

    OwnProfileUpdateRequest:
      type: object
      additionalProperties: false
      description: >
        The personal details a student may change. There is no field for the name, roll number,
        email, branch, semester or section; a request that sends one is refused.
      properties:
        phone: { type: string, pattern: "^$|^[0-9+() -]{7,20}$", nullable: true }
        bio: { type: string, maxLength: 280, nullable: true }
        personalEmail: { type: string, maxLength: 254, nullable: true }
        linkedinUrl: { type: string, maxLength: 200, nullable: true, description: "https:// is added when left out." }
        githubUrl: { type: string, maxLength: 200, nullable: true }
        portfolioUrl: { type: string, maxLength: 200, nullable: true }
        skills: { type: string, maxLength: 200, nullable: true }

    Dashboard:
      type: object
      properties:
        attendance:
          type: object
          properties:
            overallPercent: { type: number, nullable: true }
            requiredPercent: { type: number }
            subjectsBelowRequired: { type: integer }
        results:
          type: object
          properties:
            latestSgpa: { type: number, nullable: true }
            cgpa: { type: number, nullable: true }
        todayClasses:
          type: array
          items: { $ref: "#/components/schemas/TimetableEntry" }
        upcomingDeadlines:
          type: array
          items: { $ref: "#/components/schemas/Notice" }
        recentNotices:
          type: array
          items: { $ref: "#/components/schemas/Notice" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }

    AttendanceSummary:
      type: object
      required: [requiredPercent, subjects]
      properties:
        requiredPercent: { type: number }
        overallPercent: { type: number, nullable: true }
        subjects:
          type: array
          items:
            type: object
            required: [subjectId, subjectCode, subjectName, classesHeld, classesAttended, belowRequired]
            properties:
              subjectId: { type: integer, format: int64 }
              subjectCode: { type: string }
              subjectName: { type: string }
              classesHeld: { type: integer }
              classesAttended: { type: integer }
              percent: { type: number, nullable: true }
              belowRequired: { type: boolean }
        report:
          type: object
          nullable: true
          description: The college's latest attendance report for the student.
          required: [fromDate, toDate, classesHeld, classesAttended, percent, belowRequired]
          properties:
            fromDate: { type: string, format: date }
            toDate: { type: string, format: date }
            classesHeld: { type: integer }
            classesAttended: { type: integer }
            percent: { type: number }
            belowRequired: { type: boolean }

    PyqKind:
      type: string
      enum: [REGULAR, SUPPLY, MID]

    PyqMetadata:
      type: object
      required: [branch, subject, year, month, kind]
      properties:
        branch: { type: string, pattern: "^[A-Za-z]{2,10}$" }
        subject: { type: string, minLength: 3, maxLength: 120 }
        year: { type: integer, minimum: 2000, maximum: 2100 }
        month: { type: integer, minimum: 1, maximum: 12 }
        kind: { $ref: "#/components/schemas/PyqKind" }
        midNumber: { type: integer, minimum: 1, maximum: 4, nullable: true, description: "Only for a mid paper." }
        regulation: { type: string, pattern: "^$|^AR[0-9]{2}$", nullable: true }
        courseCode: { type: string, maxLength: 40, nullable: true }
        variant: { type: integer, minimum: 1, maximum: 20, nullable: true, description: "Question set; default 1." }

    PyqPaper:
      type: object
      required: [id, branch, subject, year, month, monthName, kind, variant, sizeBytes, downloads, bookmarked, status, createdAt, downloadName]
      properties:
        id: { type: integer, format: int64 }
        branch: { type: string }
        subject: { type: string }
        year: { type: integer }
        month: { type: integer }
        monthName: { type: string }
        kind: { $ref: "#/components/schemas/PyqKind" }
        midNumber: { type: integer, nullable: true }
        regulation: { type: string, nullable: true }
        courseCode: { type: string, nullable: true }
        variant: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        downloads: { type: integer }
        bookmarked: { type: boolean }
        status: { type: string, enum: [PUBLISHED, HIDDEN] }
        createdAt: { type: string, format: date-time }
        downloadName: { type: string }

    PyqLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }

    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT]

    AttendanceEntry:
      type: object
      required: [classDate, periodNo, status]
      properties:
        classDate: { type: string, format: date }
        periodNo: { type: integer }
        status: { $ref: "#/components/schemas/AttendanceStatus" }

    AttendanceSheet:
      type: object
      required: [subjectId, section, classDate, periodNo, entries]
      properties:
        subjectId: { type: integer, format: int64 }
        section: { type: string }
        classDate: { type: string, format: date }
        periodNo: { type: integer, minimum: 1, maximum: 12 }
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [studentId, status]
            properties:
              studentId: { type: integer, format: int64 }
              rollNo: { type: string, readOnly: true }
              fullName: { type: string, readOnly: true }
              status:
                allOf:
                  - { $ref: "#/components/schemas/AttendanceStatus" }
                nullable: true

    SheetSaved:
      type: object
      required: [saved, changed]
      properties:
        saved: { type: integer }
        changed: { type: integer }

    SubjectMarks:
      type: object
      properties:
        subjectId: { type: integer, format: int64 }
        subjectCode: { type: string }
        subjectName: { type: string }
        assessments:
          type: array
          items:
            type: object
            properties:
              assessmentId: { type: integer, format: int64 }
              name: { type: string }
              type: { $ref: "#/components/schemas/AssessmentType" }
              maxMarks: { type: number }
              marksObtained: { type: number, nullable: true }
              absent: { type: boolean }
              percent: { type: number, nullable: true }

    AssessmentType:
      type: string
      enum: [INTERNAL, ASSIGNMENT, LAB, SEMESTER_EXAM]

    Assessment:
      allOf:
        - { $ref: "#/components/schemas/AssessmentWriteRequest" }
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    AssessmentWriteRequest:
      type: object
      required: [subjectId, name, type, maxMarks, academicYear, published]
      properties:
        subjectId: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "#/components/schemas/AssessmentType" }
        maxMarks: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 999.99 }
        heldOn: { type: string, format: date, nullable: true }
        academicYear: { type: string, pattern: '^\d{4}-\d{2}$', example: 2026-27 }
        published: { type: boolean }

    MarksSheet:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [studentId, absent]
            properties:
              studentId: { type: integer, format: int64 }
              rollNo: { type: string, readOnly: true }
              fullName: { type: string, readOnly: true }
              marksObtained: { type: number, minimum: 0, nullable: true }
              absent: { type: boolean }

    ResultStatus:
      type: string
      enum: [PASS, FAIL, WITHHELD]

    SemesterResult:
      type: object
      required: [semester, sgpa, creditsRegistered, creditsEarned, resultStatus]
      properties:
        semester: { type: integer, minimum: 1, maximum: 8 }
        sgpa:
          type: number
          minimum: 0
          maximum: 10
          nullable: true
          description: Null when the college published no SGPA because a subject is failed. Never null for PASS.
        cgpaToDate:
          type: number
          nullable: true
          description: In the student's own results only. CGPA over this and the earlier semesters, as on the memorandum of grades.
        subjects:
          type: array
          description: In the student's own results only. Each subject with its current grade.
          items:
            type: object
            required: [subjectCode, subjectName, grade, exam, attempts, passed]
            properties:
              subjectCode: { type: string }
              subjectName: { type: string }
              credits: { type: number, nullable: true }
              grade: { type: string, enum: [O, A+, A, B+, B, C, D, F, Ab, S, U] }
              gradePoint: { type: integer, nullable: true, description: "O 10, A+ 9, A 8, B+ 7, B 6, C 5, F and Ab 0; null for S or U." }
              exam: { type: string }
              attempts: { type: integer, minimum: 1 }
              firstGrade: { type: string, nullable: true }
              passed: { type: boolean }
        creditsRegistered:
          type: integer
          minimum: 1
          description: Total credits registered in the semester, passed or failed. The CGPA weight.
        creditsEarned:
          type: integer
          minimum: 0
          description: Credits of courses passed. Not more than creditsRegistered.
        resultStatus: { $ref: "#/components/schemas/ResultStatus" }

    AdminSemesterResult:
      description: A semester result as an admin sees it, including one that is not published yet.
      allOf:
        - { $ref: "#/components/schemas/SemesterResult" }
        - type: object
          required: [studentId, published]
          properties:
            studentId: { type: integer, format: int64 }
            published: { type: boolean }

    SemesterResultWriteRequest:
      allOf:
        - { $ref: "#/components/schemas/SemesterResult" }
        - type: object
          required: [studentId, published]
          properties:
            studentId: { type: integer, format: int64 }
            published: { type: boolean }

    Results:
      type: object
      required: [semesters]
      properties:
        cgpa:
          type: number
          nullable: true
          description: Average of published SGPAs weighted by creditsRegistered. Null when nothing is published.
        semesters:
          type: array
          items: { $ref: "#/components/schemas/SemesterResult" }

    TimetableEntry:
      type: object
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, example: "09:00" }
        endTime: { type: string, example: "09:50" }
        subjectCode: { type: string }
        subjectName: { type: string }
        room: { type: string, nullable: true }
        facultyName: { type: string, nullable: true }

    NoticeCategory:
      type: string
      enum: [GENERAL, EXAM, ASSIGNMENT, EVENT]

    Notice:
      type: object
      required: [id, title, body, category, status]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        category: { $ref: "#/components/schemas/NoticeCategory" }
        targetBranch: { type: string, nullable: true }
        targetSemester: { type: integer, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        publishedAt: { type: string, format: date-time, nullable: true }
        documentType:
          type: string
          nullable: true
          enum: [application/pdf, image/jpeg]
          description: The official document's type, or null when the notice is text only.

    ComplaintRequest:
      type: object
      required: [type, category, title, description]
      properties:
        type: { type: string, enum: [PUBLIC, PRIVATE, SECURE] }
        category: { type: string, enum: [ACADEMIC, EXAMS, FACILITIES, FACULTY, ADMINISTRATION, OTHER] }
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 2000 }
        showIdentity: { type: boolean, description: "Public complaints only: show the roll number to other students." }

    Complaint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [PUBLIC, PRIVATE, SECURE] }
        category: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, REJECTED] }
        adminResponse: { type: string, nullable: true }
        respondedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        authorRollNo: { type: string, nullable: true, description: "Only a public complaint whose author chose to show it." }
        supporters: { type: integer }
        group: { type: boolean, description: "True from 5 supporters." }
        supported: { type: boolean }
        mine: { type: boolean }

    AdminComplaint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [PUBLIC, PRIVATE, SECURE] }
        category: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        adminResponse: { type: string, nullable: true }
        respondedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, description: "Cut to the day for a secure complaint." }
        student: { type: object, nullable: true, description: "Always null for a secure complaint." }
        identityProtected: { type: boolean }
        hiddenFromStudents: { type: boolean }
        supporters: { type: integer }
        group: { type: boolean }
        supportedBy: { type: array, items: { type: object } }

    NoticeDocumentLink:
      type: object
      required: [url, expiresAt, contentType]
      properties:
        url: { type: string, description: "Signed link, valid for five minutes." }
        expiresAt: { type: string, format: date-time }
        contentType: { type: string, enum: [application/pdf, image/jpeg] }

    ResourceSubjectFolder:
      type: object
      required: [subjectId, subjectCode, subjectName, semester, resources]
      properties:
        subjectId: { type: integer, format: int64 }
        subjectCode: { type: string }
        subjectName: { type: string }
        semester: { type: integer }
        resources: { type: integer, format: int64, description: Published resources of the subject. }

    NoticeWriteRequest:
      type: object
      required: [title, body, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        category: { $ref: "#/components/schemas/NoticeCategory" }
        targetBranch: { type: string, maxLength: 20, nullable: true }
        targetSemester: { type: integer, minimum: 1, maximum: 8, nullable: true }
        dueDate: { type: string, format: date, nullable: true }

    Subject:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        branch: { type: string }
        semester: { type: integer }
        credits: { type: integer }

    Unit:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unitNo: { type: integer }
        title: { type: string }

    ResourceType:
      type: string
      enum: [NOTES, SYLLABUS, LAB_MANUAL, QUESTION_PAPER, MODEL_PAPER, IMPORTANT_QUESTIONS]

    ExamType:
      type: string
      enum: [INTERNAL, SEMESTER, SUPPLEMENTARY, MODEL]

    QuestionPaperDetails:
      type: object
      required: [examYear, examType]
      properties:
        examYear: { type: integer, minimum: 2000, maximum: 2100 }
        examType: { $ref: "#/components/schemas/ExamType" }
        maxMarks: { type: integer, minimum: 1, nullable: true }

    ResourceMetadata:
      type: object
      required: [title, subjectId, type]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000, nullable: true }
        subjectId: { type: integer, format: int64 }
        unitId: { type: integer, format: int64, nullable: true }
        type: { $ref: "#/components/schemas/ResourceType" }
        questionPaper:
          allOf:
            - { $ref: "#/components/schemas/QuestionPaperDetails" }
          nullable: true

    Resource:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string, nullable: true }
        subjectId: { type: integer, format: int64 }
        subjectCode: { type: string }
        subjectName: { type: string }
        unitId: { type: integer, format: int64, nullable: true }
        unitNo: { type: integer, nullable: true }
        unitTitle: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/ResourceType" }
        fileSizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        bookmarked: { type: boolean }
        questionPaper:
          allOf:
            - { $ref: "#/components/schemas/QuestionPaperDetails" }
          nullable: true

    ResourcePage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/Resource" }

    OptionKey:
      type: string
      enum: [A, B, C, D]

    StartQuizRequest:
      type: object
      required: [subjectId, unitId, questionCount]
      properties:
        subjectId: { type: integer, format: int64 }
        unitId: { type: integer, format: int64 }
        questionCount: { type: integer, enum: [5, 10, 20] }

    QuizOption:
      type: object
      required: [key, text]
      properties:
        key: { $ref: "#/components/schemas/OptionKey" }
        text: { type: string }

    QuizAttemptStarted:
      type: object
      required: [attemptId, startedAt, expiresAt, durationSeconds, questions]
      properties:
        attemptId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        questions:
          type: array
          items:
            type: object
            required: [questionId, position, text, options]
            properties:
              questionId: { type: integer, format: int64 }
              position: { type: integer }
              text: { type: string }
              options:
                type: array
                minItems: 4
                maxItems: 4
                items: { $ref: "#/components/schemas/QuizOption" }

    SubmitQuizRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          maxItems: 20
          items:
            type: object
            required: [questionId]
            properties:
              questionId: { type: integer, format: int64 }
              selectedOption:
                allOf:
                  - { $ref: "#/components/schemas/OptionKey" }
                nullable: true

    QuizAttemptSummary:
      type: object
      properties:
        attemptId: { type: integer, format: int64 }
        subjectId: { type: integer, format: int64 }
        subjectCode: { type: string }
        subjectName: { type: string }
        unitId: { type: integer, format: int64 }
        unitNo: { type: integer }
        unitTitle: { type: string }
        status: { type: string, enum: [IN_PROGRESS, SUBMITTED, EXPIRED] }
        score: { type: integer, nullable: true }
        questionCount: { type: integer }
        startedAt: { type: string, format: date-time }

    QuizResult:
      type: object
      required: [attemptId, status, questionCount, items]
      properties:
        attemptId: { type: integer, format: int64 }
        status: { type: string, enum: [SUBMITTED, EXPIRED] }
        score: { type: integer }
        questionCount: { type: integer }
        percent: { type: number }
        startedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
        subjectId: { type: integer, format: int64 }
        subjectCode: { type: string }
        subjectName: { type: string }
        unitId: { type: integer, format: int64 }
        unitNo: { type: integer }
        unitTitle: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              questionId: { type: integer, format: int64 }
              position: { type: integer }
              text: { type: string }
              options:
                type: array
                items: { $ref: "#/components/schemas/QuizOption" }
              selectedOption:
                allOf:
                  - { $ref: "#/components/schemas/OptionKey" }
                nullable: true
              correctOption: { $ref: "#/components/schemas/OptionKey" }
              correct: { type: boolean }
              explanation: { type: string }

    PerformanceLevel:
      type: string
      enum: [NOT_ENOUGH_DATA, NEEDS_REVISION, IMPROVING, STRONG]

    Recommendation:
      type: object
      properties:
        subjectId: { type: integer, format: int64 }
        subjectCode: { type: string }
        unitId: { type: integer, format: int64 }
        unitNo: { type: integer }
        unitTitle: { type: string }
        accuracyPercent: { type: number }
        resources:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              type: { $ref: "#/components/schemas/ResourceType" }

    Progress:
      type: object
      properties:
        testsTaken: { type: integer, description: Submitted attempts. Expired attempts are not counted. }
        averagePercent: { type: number, nullable: true, description: Mean score of the submitted attempts. }
        units:
          type: array
          items:
            type: object
            properties:
              subjectId: { type: integer, format: int64 }
              subjectCode: { type: string }
              subjectName: { type: string }
              unitId: { type: integer, format: int64 }
              unitNo: { type: integer }
              unitTitle: { type: string }
              answered: { type: integer }
              correct: { type: integer }
              accuracyPercent: { type: number, nullable: true }
              level: { $ref: "#/components/schemas/PerformanceLevel" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }

    AiBasis:
      type: string
      enum: [GENERAL_KNOWLEDGE, PROVIDED_TEXT, MIXED]

    ExplainRequest:
      type: object
      required: [topic, answerFormat]
      properties:
        topic: { type: string, minLength: 3, maxLength: 200 }
        subjectId: { type: integer, format: int64, nullable: true }
        unitId: { type: integer, format: int64, nullable: true }
        answerFormat: { type: string, enum: [SIMPLE, FIVE_MARK, TEN_MARK] }
        context: { type: string, maxLength: 2000, nullable: true }

    ExplainResponse:
      type: object
      required: [topic, answerFormat, explanation, keyPoints, basis, notice, promptVersion]
      properties:
        topic: { type: string }
        answerFormat: { type: string, enum: [SIMPLE, FIVE_MARK, TEN_MARK] }
        explanation: { type: string }
        keyPoints:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string }
        example: { type: string, nullable: true }
        basis: { $ref: "#/components/schemas/AiBasis" }
        notice: { type: string }
        promptVersion: { type: string }

    SummarizeRequest:
      type: object
      required: [text, style]
      properties:
        text: { type: string, minLength: 200, maxLength: 12000 }
        style: { type: string, enum: [SHORT, REVISION_NOTES] }
        subjectId: { type: integer, format: int64, nullable: true }

    SummarizeResponse:
      type: object
      required: [summary, keyPoints, definitions, basis, notice, promptVersion]
      properties:
        summary: { type: string }
        keyPoints:
          type: array
          maxItems: 10
          items: { type: string }
        definitions:
          type: array
          maxItems: 15
          items:
            type: object
            required: [term, meaning]
            properties:
              term: { type: string }
              meaning: { type: string }
        basis: { $ref: "#/components/schemas/AiBasis" }
        notice: { type: string }
        promptVersion: { type: string }

    GenerateQuizRequest:
      type: object
      required: [questionType, count]
      description: Exactly one of topic or sourceText is required.
      properties:
        topic: { type: string, minLength: 3, maxLength: 200, nullable: true }
        sourceText: { type: string, minLength: 200, maxLength: 8000, nullable: true }
        subjectId: { type: integer, format: int64, nullable: true }
        unitId: { type: integer, format: int64, nullable: true }
        questionType: { type: string, enum: [MCQ, SHORT, LONG] }
        count: { type: integer, minimum: 1, maximum: 10 }

    GenerateQuizResponse:
      type: object
      required: [questions, requested, returned, basis, notice, promptVersion]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [type, question, answer, explanation]
            properties:
              type: { type: string, enum: [MCQ, SHORT, LONG] }
              question: { type: string }
              options:
                type: array
                nullable: true
                minItems: 4
                maxItems: 4
                items: { type: string }
              correctOption:
                allOf:
                  - { $ref: "#/components/schemas/OptionKey" }
                nullable: true
              answer: { type: string }
              explanation: { type: string }
        requested: { type: integer }
        returned: { type: integer }
        basis: { $ref: "#/components/schemas/AiBasis" }
        notice: { type: string }
        promptVersion: { type: string }

    AiUsage:
      type: object
      required: [dailyLimit, usedToday, remainingToday, resetsAt, enabled]
      properties:
        dailyLimit: { type: integer }
        usedToday: { type: integer }
        remainingToday: { type: integer }
        resetsAt: { type: string, format: date-time }
        enabled:
          type: boolean
          description: False when AI is switched off or the application-wide daily ceiling has been reached.
        demo:
          type: boolean
          description: True when the built-in mock provider answers (AI_PROVIDER=mock). The page then says that the answers are placeholders.

    StudentCreateRequest:
      type: object
      additionalProperties: false
      description: >
        Roster details for one student. There is no email and no password
        field: the email is generated and the temporary password is the roll
        number.
      required: [rollNo, fullName, branch, currentSemester, section, admissionYear]
      properties:
        rollNo: { type: string, minLength: 1, maxLength: 20, pattern: "^[A-Za-z0-9]+$" }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        branch: { type: string, minLength: 1, maxLength: 20 }
        currentSemester: { type: integer, minimum: 1, maximum: 8 }
        section: { type: string, minLength: 1, maxLength: 5 }
        admissionYear: { type: integer, minimum: 2000, maximum: 2100 }
        phone: { type: string, maxLength: 20, nullable: true }

    StudentUpdateRequest:
      type: object
      additionalProperties: false
      description: Profile fields that may be edited. The roll number and the login email cannot be changed.
      required: [fullName, branch, currentSemester, section, admissionYear]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        branch: { type: string, minLength: 1, maxLength: 20 }
        currentSemester: { type: integer, minimum: 1, maximum: 8 }
        section: { type: string, minLength: 1, maxLength: 5 }
        admissionYear: { type: integer, minimum: 2000, maximum: 2100 }
        phone: { type: string, maxLength: 20, nullable: true }

    AdminStudent:
      allOf:
        - { $ref: "#/components/schemas/StudentProfile" }
        - type: object
          required: [id, active, mustChangePassword, locked]
          properties:
            id: { type: integer, format: int64 }
            active: { type: boolean }
            mustChangePassword:
              type: boolean
              description: True while the account still has a temporary password.
            locked: { type: boolean }
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
              description: Null means the account is still awaiting its first login.

    SubjectWriteRequest:
      type: object
      required: [code, name, branch, semester, credits, active]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
        name: { type: string, minLength: 1, maxLength: 150 }
        branch: { type: string, minLength: 1, maxLength: 20 }
        semester: { type: integer, minimum: 1, maximum: 8 }
        credits: { type: integer, minimum: 0, maximum: 10 }
        active: { type: boolean }

    AdminSubject:
      allOf:
        - { $ref: "#/components/schemas/Subject" }
        - type: object
          required: [active]
          properties:
            active: { type: boolean }

    UnitWriteRequest:
      type: object
      required: [unitNo, title]
      properties:
        unitNo: { type: integer, minimum: 1, maximum: 20 }
        title: { type: string, minLength: 1, maxLength: 200 }

    TimetableWriteRequest:
      type: object
      required: [branch, semester, section, dayOfWeek, startTime, endTime, subjectId]
      properties:
        branch: { type: string, minLength: 1, maxLength: 20 }
        semester: { type: integer, minimum: 1, maximum: 8 }
        section: { type: string, minLength: 1, maxLength: 5 }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string, pattern: '^\d{2}:\d{2}$', example: "09:00" }
        endTime: { type: string, pattern: '^\d{2}:\d{2}$', example: "09:50" }
        subjectId: { type: integer, format: int64 }
        room: { type: string, maxLength: 30, nullable: true }
        facultyName: { type: string, maxLength: 120, nullable: true }

    AdminTimetableEntry:
      allOf:
        - { $ref: "#/components/schemas/TimetableWriteRequest" }
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }

    ResourceUpdateRequest:
      allOf:
        - { $ref: "#/components/schemas/ResourceMetadata" }
        - type: object
          required: [status]
          properties:
            status: { $ref: "#/components/schemas/ResourceStatus" }

    ResourceStatus:
      type: string
      enum: [PUBLISHED, HIDDEN]

    AdminResource:
      allOf:
        - { $ref: "#/components/schemas/Resource" }
        - type: object
          required: [status]
          properties:
            status: { $ref: "#/components/schemas/ResourceStatus" }

    QuestionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]

    QuizQuestionWriteRequest:
      type: object
      required: [subjectId, unitId, questionText, optionA, optionB, optionC, optionD, correctOption, explanation, difficulty, status]
      properties:
        subjectId: { type: integer, format: int64 }
        unitId: { type: integer, format: int64 }
        questionText: { type: string, minLength: 1, maxLength: 1000 }
        optionA: { type: string, minLength: 1, maxLength: 300 }
        optionB: { type: string, minLength: 1, maxLength: 300 }
        optionC: { type: string, minLength: 1, maxLength: 300 }
        optionD: { type: string, minLength: 1, maxLength: 300 }
        correctOption: { $ref: "#/components/schemas/OptionKey" }
        explanation: { type: string, minLength: 1, maxLength: 2000 }
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        status: { $ref: "#/components/schemas/QuestionStatus" }

    AdminQuizQuestion:
      allOf:
        - { $ref: "#/components/schemas/QuizQuestionWriteRequest" }
        - type: object
          required: [id, source, used]
          properties:
            id: { type: integer, format: int64 }
            source: { type: string, enum: [ADMIN, AI_GENERATED] }
            subjectCode: { type: string }
            unitNo: { type: integer }
            unitTitle: { type: string }
            used: { type: boolean, description: True once the question has been served in an attempt. }
            createdAt: { type: string, format: date-time }
