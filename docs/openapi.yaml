openapi: 3.0.3
info:
  title: Campus Companion API
  version: 0.2.0
  description: >
    REST API for Campus Companion. This file is the authoritative contract for
    the endpoints it lists. It covers every P0 endpoint in section 7 of
    docs/09-api-contract.md. Endpoints marked P1 there are added by the task
    that implements them. The health endpoint (/actuator/health) is outside
    /api/v1 and is not listed here. Conventions and examples are in
    docs/09-api-contract.md. Login uses the account's institutional email
    address; see docs/decisions/0008-institutional-email-login.md.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Student
  - name: Resources
  - name: Quiz
  - name: AI
  - name: Admin
security:
  - sessionCookie: []
    csrfHeader: []

paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Get a CSRF token
      security: []
      responses:
        "200":
          description: Token issued; also set as the XSRF-TOKEN cookie.
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: { type: string, example: X-XSRF-TOKEN }
                  token: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with institutional email and password
      description: >
        The email is trimmed and lower-cased before lookup. A wrong password,
        an email with no account and a deactivated account return the same 401.
        After five consecutive failures for an email, further attempts return
        423 whether or not an account exists. When mustChangePassword is true,
        the server accepts only /auth/csrf, /auth/me, /auth/change-password and
        /auth/logout until the password has been changed.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session cookie set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      description: >
        Requires the current password and the new password twice. On success
        the must-change flag is cleared, the user's other sessions are ended
        and the session identifier is renewed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /students/me:
    get:
      tags: [Student]
      summary: Own profile
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Student]
      summary: Change own phone number and text
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnProfileUpdateRequest" }
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "400": { $ref: "#/components/responses/Problem" }

  /students/me/photo:
    put:
      tags: [Student]
      summary: Add or replace own profile photo
      description: >
        The upload is checked and redrawn. What is stored is a new 512 by 512 JPEG; the uploaded
        file and its metadata are discarded.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG, at most 2 MB, 64 to 6000 pixels on each side.
      responses:
        "200":
          description: The profile, now with hasPhoto true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Student]
      summary: Remove own profile photo (idempotent)
      responses:
        "204": { description: Removed, or there was none. }
        "503": { $ref: "#/components/responses/Problem" }

  /students/me/photo-url:
    get:
      tags: [Student]
      summary: Short-lived signed link to own profile photo
      responses:
        "200":
          description: Signed link valid for at most five minutes.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /students/me/dashboard:
    get:
      tags: [Student]
      summary: Dashboard summary
      responses:
        "200":
          description: Dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /attendance/me:
    get:
      tags: [Student]
      summary: Own subject-wise attendance
      responses:
        "200":
          description: Attendance summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /attendance/me/subjects/{subjectId}:
    get:
      tags: [Student]
      summary: Own attendance history for one subject
      parameters:
        - { $ref: "#/components/parameters/SubjectIdPath" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of attendance entries, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/AttendanceEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /marks/me:
    get:
      tags: [Student]
      summary: Own published marks
      parameters:
        - { name: subjectId, in: query, schema: { type: integer, format: int64 } }
        - { name: semester, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
      responses:
        "200":
          description: Marks grouped by subject.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubjectMarks" }
        "401": { $ref: "#/components/responses/Problem" }

  /results/me:
    get:
      tags: [Student]
      summary: Own semester results and CGPA
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Results" }
        "401": { $ref: "#/components/responses/Problem" }

  /timetable/me:
    get:
      tags: [Student]
      summary: Own timetable
      parameters:
        - name: day
          in: query
          description: 1 is Monday. Omit for the whole week.
          schema: { type: integer, minimum: 1, maximum: 7 }
      responses:
        "200":
          description: Timetable entries in day and time order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimetableEntry" }
        "401": { $ref: "#/components/responses/Problem" }

  /notices:
    get:
      tags: [Student]
      summary: Published notices visible to the user
      parameters:
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/NoticeCategory" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of notices, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/Notice" }
        "401": { $ref: "#/components/responses/Problem" }

  /notices/{id}:
    get:
      tags: [Student]
      summary: One published notice
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200":
          description: Notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "404": { $ref: "#/components/responses/Problem" }

  /notices/{id}/document:
    get:
      tags: [Student]
      summary: Signed link to a notice's official document
      description: Only for a notice the user may read. With download=true the file is saved under a readable name.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: download, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeDocumentLink" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /subjects:
    get:
      tags: [Student]
      summary: Subjects visible to the user
      parameters:
        - { name: semester, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
      responses:
        "200":
          description: Subjects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }

  /subjects/{id}/units:
    get:
      tags: [Student]
      summary: Units of a subject
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200":
          description: Units in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Unit" }
        "404": { $ref: "#/components/responses/Problem" }

  /resources:
    get:
      tags: [Resources]
      summary: Search published resources
      parameters:
        - { name: subjectId, in: query, schema: { type: integer, format: int64 } }
        - { name: unitId, in: query, schema: { type: integer, format: int64 } }
        - { name: semester, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/ResourceType" }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc", enum: ["createdAt,desc", "createdAt,asc", "title,asc", "title,desc"] }
      responses:
        "200":
          description: Page of resources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /resources/subjects:
    get:
      tags: [Resources]
      summary: Subject folders of the resource hub
      description: Subjects that have published resources, newest semester first, then by name.
      responses:
        "200":
          description: Folders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResourceSubjectFolder" }

  /resources/{id}:
    get:
      tags: [Resources]
      summary: Resource details
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200":
          description: Resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "404": { $ref: "#/components/responses/Problem" }

  /resources/{id}/download-url:
    get:
      tags: [Resources]
      summary: Short-lived signed link to the file
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - name: download
          in: query
          description: true for a link that saves the file under its original name; false (the default) for a link that shows it in the page.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Signed link valid for at most five minutes.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /question-papers:
    get:
      tags: [Resources]
      summary: Search previous-year and model papers
      parameters:
        - { name: subjectId, in: query, schema: { type: integer, format: int64 } }
        - { name: examYear, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - name: examType
          in: query
          schema: { $ref: "#/components/schemas/ExamType" }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of papers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePage" }

  /bookmarks/me:
    get:
      tags: [Resources]
      summary: Own bookmarks
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of bookmarked resources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePage" }

  /bookmarks/{resourceId}:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Resources]
      summary: Add a bookmark (idempotent)
      responses:
        "204": { description: Bookmarked. }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Resources]
      summary: Remove a bookmark (idempotent)
      responses:
        "204": { description: Removed, or was not bookmarked. }

  /quiz-attempts:
    post:
      tags: [Quiz]
      summary: Start a test
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartQuizRequest" }
      responses:
        "201":
          description: Attempt created. Contains no correct answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttemptStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /quiz-attempts/me:
    get:
      tags: [Quiz]
      summary: Own attempt history
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Page of attempts, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PageMeta" }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/QuizAttemptSummary" }

  /quiz-attempts/{id}:
    get:
      tags: [Quiz]
      summary: Result of own attempt
      description: >
        Only a closed attempt has a result. An attempt that is still running answers 409, so its
        correct options cannot be read before it is submitted. An attempt whose time and grace
        period have passed is closed as EXPIRED by this request.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /quiz-attempts/{id}/submit:
    post:
      tags: [Quiz]
      summary: Submit answers
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitQuizRequest" }
      responses:
        "200":
          description: Scored result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /progress/me:
    get:
      tags: [Quiz]
      summary: Unit performance and revision recommendations
      responses:
        "200":
          description: Progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }

  /ai/explain:
    post:
      tags: [AI]
      summary: Explain a topic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExplainRequest" }
      responses:
        "200":
          description: Explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }

  /ai/summarize:
    post:
      tags: [AI]
      summary: Summarize pasted text
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummarizeRequest" }
      responses:
        "200":
          description: Summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummarizeResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }

  /ai/generate-quiz:
    post:
      tags: [AI]
      summary: Generate practice questions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateQuizRequest" }
      responses:
        "200":
          description: Practice questions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateQuizResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }

  /notes:
    get:
      tags: [Student]
      summary: List notes of a view (all, recent, pinned, shared, attachments, trash, archived)
      responses:
        "200": { description: "{ notes: [...] }" }
    post:
      tags: [Student]
      summary: Create a note (needs a title or content)
      responses:
        "201": { description: The note. }
        "400": { $ref: "#/components/responses/Problem" }

  /notes/{id}:
    get:
      tags: [Student]
      summary: One note, own or shared with the student
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200": { description: The note. }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Student]
      summary: Change a note; an edit that empties it deletes it
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200": { description: "{ note } or { deleted: true }" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Student]
      summary: Move to the Trash, or destroy with permanent=true
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "204": { description: Done. }
        "404": { $ref: "#/components/responses/Problem" }

  /notes/{id}/duplicate:
    post:
      tags: [Student]
      summary: Copy a note
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "201": { description: The copy. }
        "404": { $ref: "#/components/responses/Problem" }

  /notes/bulk:
    post:
      tags: [Student]
      summary: One action on many notes
      responses:
        "200": { description: "{ success, count }" }
        "400": { $ref: "#/components/responses/Problem" }

  /notes/folders:
    get:
      tags: [Student]
      summary: Folders with counts and previews
      responses:
        "200": { description: "{ folders: [...] }" }
    post:
      tags: [Student]
      summary: Create a folder
      responses:
        "201": { description: The folder. }
        "409": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Student]
      summary: Reorder folders in one request
      responses:
        "204": { description: Done. }

  /notes/folders/{id}:
    patch:
      tags: [Student]
      summary: Rename, recolour, move a folder
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200": { description: The folder. }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Student]
      summary: Delete a folder; its notes become unfiled
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }

  /notes/attachments:
    get:
      tags: [Student]
      summary: The student's pictures and files
      responses:
        "200": { description: "{ attachments: [...] }" }
    post:
      tags: [Student]
      summary: Attach a picture (stored as JPEG) or a PDF
      responses:
        "201": { description: The attachment. }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }

  /notes/attachments/{id}:
    delete:
      tags: [Student]
      summary: Delete an attachment and its stored file
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }

  /notes/attachments/{id}/file:
    get:
      tags: [Student]
      summary: Redirect to a five-minute signed link
      description: >-
        For the uploader; a named recipient of the note; or, with `share`, a student who holds the
        note's share link while it is on. Not for anyone else, and for nobody but the uploader
        while the note is in the Trash.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: download, in: query, schema: { type: boolean, default: false } }
        - { name: share, in: query, description: The slug of the note's share link, schema: { type: string } }
      responses:
        "302": { description: Redirect. }
        "404": { $ref: "#/components/responses/Problem" }

  /notes/{id}/links:
    get:
      tags: [Student]
      summary: Links from a note
      parameters:
