        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "CSV in UTF-8, at most 1 MB and 1,000 lines." }
      responses:
        "200":
          description: What was saved.
          content:
            application/json:
              schema:
                type: object
                required: [created, corrected, unchanged]
                properties:
                  created: { type: integer }
                  corrected: { type: integer }
                  unchanged: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }

