# Runs the full build and every test on each push to main (task T1-11).
# Integration tests start PostgreSQL in Docker through Testcontainers; the runner provides Docker.
# No secret is needed: the tests never connect to Supabase or any other hosted service.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and check formatting
        run: ./mvnw -B verify

      # The browser-module tests use Node's own test runner and need no packages (docs/17 section 7).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser-module tests
        run: node --test "src/test/js/**/*.test.mjs"
